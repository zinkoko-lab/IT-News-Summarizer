name: Deploy Lambda (Prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-lambda-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      TOP_N: ${{ secrets.TOP_N }}
      REQUEST_TIMEOUT_SECONDS: ${{ secrets.REQUEST_TIMEOUT_SECONDS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          required=(AWS_REGION FUNCTION_NAME AWS_ROLE_TO_ASSUME NEWS_API_KEY GEMINI_API_KEY LINE_CHANNEL_ACCESS_TOKEN LINE_USER_ID)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret/env: $name"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build deployment package
        run: |
          python -m pip install --upgrade pip
          mkdir -p build/lambda/package
          pip install -r requirements.txt -t build/lambda/package
          cp -R app build/lambda/package/
          cp lambda_function.py build/lambda/package/
          cd build/lambda/package
          zip -r ../news_summarizer_lambda.zip .

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --zip-file fileb://build/lambda/news_summarizer_lambda.zip

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --handler lambda_function.handler \
            --runtime python3.11 \
            --timeout 60 \
            --environment "Variables={NEWS_API_KEY=$NEWS_API_KEY,GEMINI_API_KEY=$GEMINI_API_KEY,LINE_CHANNEL_ACCESS_TOKEN=$LINE_CHANNEL_ACCESS_TOKEN,LINE_USER_ID=$LINE_USER_ID,GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash},TOP_N=${TOP_N:-5},REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-20}}"

      - name: Verify function exists
        run: |
          aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" >/dev/null
